name: Fiscalismia-Webscraper Pipeline

on:
  push:
    branches:
      - main
      - pipeline_testing
  pull_request:
    branches:
      - main

jobs:
  snyk-security-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # required for SARIF upload to GitHub Code Scanning

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v5
      # https://github.com/actions/checkout

    - name: Snyk Dependency Security Analysis
      uses: snyk/actions/python@master
      # https://github.com/snyk/actions/tree/master/python
      continue-on-error: true  # don't block the pipeline; review results in GitHub Security tab
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
              --sarif-file-output=snyk-open-source.sarif

    - name: Upload Snyk Open Source SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk-open-source.sarif
        category: snyk-open-source

    - name: Snyk Static Code Security Analysis
      uses: snyk/actions/python@master
      # https://github.com/snyk/actions/tree/master/python
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: code test
        args: --severity-threshold=high
              --sarif-file-output=snyk-code.sarif

    - name: Upload Snyk Code SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

  build-and-publish-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write # to publish to ghcr.io

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v5
      # https://github.com/actions/checkout

    - name: AutoIncrement Version
      run: |
        echo "BUILD_VERSION=0.9.1" >> $GITHUB_ENV

    - name: Set Buildah Build Timestamp
      shell: bash
      run: |
        # Store the current time in ISO 8601 format (required by OCI spec)
        echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    - name: Buildah Image Creation - Demo
      id: build-demo-image
      uses: redhat-actions/buildah-build@v2.13
      # https://github.com/redhat-actions/buildah-build/releases
      with:
        image: fiscalismia-webscraper-demo
        tags: latest ${{ env.BUILD_VERSION }}
        containerfiles: |
          ./Dockerfile
        build-args: |
          BUILD_VERSION=${{ env.BUILD_VERSION }}
        labels: |
          org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Demo Image for Webscraping with Python Playwright FastAPI Server for Fiscalismia, a Web Service for visualizing, analyzing, aggregating, importing and exporting personal finance data.
          org.opencontainers.image.licenses=MIT

    - name: Buildah Image Creation - Production
      id: build-production-image
      uses: redhat-actions/buildah-build@v2.13
      # https://github.com/redhat-actions/buildah-build/releases
      with:
        image: fiscalismia-webscraper
        tags: latest ${{ env.BUILD_VERSION }}
        containerfiles: |
          ./Dockerfile
        build-args: |
          BUILD_VERSION=${{ env.BUILD_VERSION }}
        labels: |
          org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Production Image for Webscraping with Python Playwright FastAPI Server for Fiscalismia, a Web Service for visualizing, analyzing, aggregating, importing and exporting personal finance data
          org.opencontainers.image.licenses=MIT

    - name: Log in to Github Container Registry
      if: github.event_name == 'push'
      uses: redhat-actions/podman-login@v1.7
      # https://github.com/redhat-actions/podman-login/releases
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Demo Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: push-demo-to-ghcr
      uses: redhat-actions/push-to-registry@v2.8
      # https://github.com/redhat-actions/push-to-registry/releases
      with:
        image: ${{ steps.build-demo-image.outputs.image }}
        tags: ${{ steps.build-demo-image.outputs.tags }}
        registry: ghcr.io/fiscalismia

    - name: Push Production Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: push-prod-to-ghcr
      uses: redhat-actions/push-to-registry@v2.8
      # https://github.com/redhat-actions/push-to-registry/releases
      with:
        image: ${{ steps.build-production-image.outputs.image }}
        tags: ${{ steps.build-production-image.outputs.tags }}
        registry: ghcr.io/fiscalismia

    - name: Print image url
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Production Image pushed to ${{ steps.push-prod-to-ghcr.outputs.registry-paths }}"
        echo "Demo Image pushed to ${{ steps.push-demo-to-ghcr.outputs.registry-paths }}"

    - name: Print build success (PR)
      if: github.event_name == 'pull_request'
      run: |
        echo "Build successful for PR"
        echo "Demo Image would be: ${{ steps.build-demo-image.outputs.image }}:${{ steps.build-demo-image.outputs.tags }}"
        echo "Production Image would be: ${{ steps.build-production-image.outputs.image }}:${{ steps.build-production-image.outputs.tags }}"

  snyk-container-scan:
    needs: build-and-publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # to pull from ghcr.io
      security-events: write  # required for SARIF upload to GitHub Code Scanning

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v5
      # https://github.com/actions/checkout

    # # Authenticate so Snyk can pull the image from GHCR
    # - name: Log in to Github Container Registry
    #   run: |
    #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Log in to Github Container Registry
      uses: redhat-actions/podman-login@v1.7
      # https://github.com/redhat-actions/podman-login/releases
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Snyk Container Analysis - Production Image
      uses: snyk/actions/docker@master
      # https://github.com/snyk/actions/tree/master/docker
      # https://docs.snyk.io/developer-tools/snyk-ci-cd-integrations/github-actions-for-snyk-setup-and-checking-for-vulnerabilities/snyk-docker-action
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: ghcr.io/fiscalismia/fiscalismia-webscraper:latest
        args: --file=Dockerfile
              --severity-threshold=high

    - name: Upload Snyk Container SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk.sarif
        category: snyk-container
