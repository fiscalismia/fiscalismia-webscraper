events {
    worker_connections 4096;
}

# TODO potentially think about keepalive config for less delay and performance
# see https://ma.ttias.be/enable-keepalive-connections-in-nginx-upstream-proxy-configurations/

http {
    # Required for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Define the upstream server (your Docker container)
    upstream fastapi_server {
        server 127.0.0.1:3003; # Uvicorn runs on port 8000 inside the container
        keepalive 32; # Keep 32 connections alive for performance
    }

    server {
        listen 5000; # Nginx listens on port 5000 inside the container
        server_name localhost; # Or your domain name

        client_max_body_size 50m; # max body size for client requests

        location / {

            proxy_http_version 1.1; # Required: nginx defaults to HTTP/1.0 for proxying, but WebSocket needs 1.1
            proxy_set_header Upgrade $http_upgrade; # Forward the Upgrade header so Uvicorn sees the WebSocket handshake
            proxy_set_header Connection $connection_upgrade; # Set to "upgrade" for WS requests, "close" for normal HTTP (via map)

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 90s; # timeout before nginx throws 504 Gateway Time-out

            proxy_redirect off;
            proxy_buffering off; # Useful for streaming responses

            proxy_pass http://fastapi_server; # Pass requests to the upstream server
        }
    }
}
