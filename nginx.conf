# =============================================================================
# Nginx Reverse Proxy Configuration
# Fiscalismia Webscraper — FastAPI + Playwright CDP Screencast Streaming
# =============================================================================
# References:
#   WebSocket proxying:  https://websocket.org/guides/infrastructure/nginx/
#   Proxy buffer tuning: https://usavps.com/blog/nginx-proxy-buffers/
#   SSL session caching: https://nginx.org/en/docs/http/ngx_http_ssl_module.html
# =============================================================================

user nginx;                    # Workers run as unprivileged nginx user (supervisor starts master as root)
worker_processes auto;         # Auto-detect CPU cores (3 workers on 3 vCPU)
worker_rlimit_nofile 8192;     # Per-worker FD limit. Each proxied connection uses ~2 FDs (client + upstream).

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    use epoll;                 # O(1) event handling on Linux (vs O(n) for select/poll)
    multi_accept on;           # Accept all pending connections per event notification
    worker_connections 4096;   # Max simultaneous connections per worker (~160 bytes each, negligible memory)
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # Temp paths — all in /tmp (writable by unprivileged nginx user)
    # =========================================================================
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    # Cap proxy temp file size to prevent filling /tmp in container RAM.
    proxy_max_temp_file_size 64m;
    proxy_temp_file_write_size 64k;

    # =========================================================================
    # General HTTP settings
    # =========================================================================
    server_tokens off;         # Hide nginx version in response headers
    sendfile on;               # Kernel-level file transfer (bypass user-space copy)
    tcp_nopush on;             # Cork packets until sendfile completes (full packets only)
    tcp_nodelay on;            # Disable Nagle's algorithm — critical for low-latency WebSocket frames
    keepalive_timeout 65;      # Client-facing keep-alive (matches common browser defaults)
    map_hash_bucket_size 128;  # Accommodate longer domain names in map directives

    # =========================================================================
    # Gzip — applies to REST and catch-all; explicitly disabled in WebSocket location
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss;

    # =========================================================================
    # WebSocket upgrade map
    # =========================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================================
    # TLS session resumption — abbreviates handshakes on client reconnect
    # =========================================================================
    # TLS 1.3 uses PSK (Pre-Shared Keys) via NewSessionTicket messages for session resumption.
    ssl_session_tickets on;            # Required for TLS 1.3 resumption via NewSessionTicket/PSK
    ssl_session_timeout 4h;            # Ticket validity — limits how long a session can be resumed

    # =========================================================================
    # Upstream — Uvicorn on port 3003
    # =========================================================================
    upstream fastapi_server {
        server 127.0.0.1:3003;     # Uvicorn runs on port 3003 inside the container
        keepalive 32;              # Pool of 32 idle keepalive connections to upstream
        keepalive_requests 1000;   # Reuse each connection for up to 1000 requests
        keepalive_timeout 60s;     # Close idle upstream connections after 60s
        keepalive_time 1h;         # Max lifetime per upstream connection — ensures recycling after deployments
    }

    server {
        listen 8444 ssl proxy_protocol; # Expects HAProxy PROXY protocol v2 headers

        server_name fastapi.demo.fiscalismia.com;

        # TLS certificates (copied into container via Dockerfile)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.3;

        # Trust HAProxy as PROXY protocol source to extract real client IP
        set_real_ip_from 172.24.1.3;    # HAProxy IP on production network
        set_real_ip_from 172.20.1.3;    # HAProxy IP on demo network
        real_ip_header proxy_protocol;

        access_log /dev/stdout combined;
        client_max_body_size 50m;

        # =====================================================================
        # WebSocket Streaming - high throuput performance
        # =====================================================================
        location /fastapi/fiscalismia/ws/ {

            # --- HTTP/1.1 + WebSocket upgrade ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # --- Timeouts for long-lived streaming connections ---
            proxy_read_timeout    3600s;   # prevents 504 on idle reads
            proxy_send_timeout    3600s;   # prevents close during transient backpressure
            proxy_connect_timeout 30s;     # Initial upstream TCP handshake — fail fast if unreachable

            # --- Zero buffering for real-time streaming ---
            proxy_buffering off;            # Do not buffer upstream responses — forward frames immediately
            proxy_request_buffering off;    # Do not buffer client→upstream messages (bidirectional WS)
            proxy_cache off;                # Streaming data is unique per frame, never cacheable

            # --- TCP-level optimizations ---
            proxy_socket_keepalive on;      # TCP keepalive probes detect dead upstream (~75s probe interval)

            # --- Disable gzip for WebSocket ---
            gzip off;

            # --- Client IP forwarding ---
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_pass http://fastapi_server;
        }

        # =====================================================================
        # REST API — /fastapi/fiscalismia/rest/
        # =====================================================================
        location /fastapi/fiscalismia/rest/ {

            proxy_http_version 1.1;
            proxy_set_header Connection "";  # enable upstream keepalive pool reuse

            # --- Buffering for REST responses ---
            proxy_buffering on;
            proxy_buffer_size 8k;           # Headers + start of body
            proxy_buffers 4 16k;            # 64k total — ample for small JSON
            proxy_busy_buffers_size 32k;    # Concurrent read/write threshold

            # --- Timeouts for REST ---
            proxy_read_timeout  30s;        # Generous for Playwright page navigation
            proxy_send_timeout  30s;
            proxy_connect_timeout 10s;      # Localhost upstream — fail fast

            # gzip inherited from http level (on) — JSON compresses ~60-70%

            # --- Client IP forwarding ---
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_pass http://fastapi_server;
        }

        # =====================================================================
        # Security — block vulnerability scanner probes
        # =====================================================================
        location ~ /\. {
            deny all;   # Return 403 Forbidden for hidden files (.git, .env, etc.)
        }

        location ~* (requirements\.txt|pyproject\.toml|setup\.py|setup\.cfg|Pipfile|Pipfile\.lock|\.env|main\.py)$ {
            deny all;   # Return 403 Forbidden for Python project config files
        }

        # =====================================================================
        # Catch-all — health check, version, root info etc.
        # =====================================================================
        location / {

            proxy_http_version 1.1;
            proxy_set_header Connection "";  # Enable upstream keepalive pool reuse

            proxy_buffering on;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;

            # --- Client IP forwarding ---
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
            proxy_pass http://fastapi_server;
        }
    }
}
